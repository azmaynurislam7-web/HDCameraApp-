name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Java and Cordova
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          npm install -g cordova

      - name: Initialize and Build Cordova App
        run: |
          cordova create temp_app com.hd.camerapro "HD Camera Pro"
          cd temp_app
          if [ -d ../www ]; then
            rm -rf www
            cp -r ../www ./www
          fi
          if [ -f ../config.xml ]; then
            cp ../config.xml ./config.xml
          fi
          cordova platform add android --nosave
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: temp_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
