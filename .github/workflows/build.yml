name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Install Cordova
        run: npm install -g cordova

      - name: Initialize and Build Cordova App
        run: |
          cordova create temp_app com.hd.camerapro "HD Camera Pro"
          cd temp_app
          
          if [ -d ../www ]; then
            rm -rf www
            cp -r ../www ./www
          elif [ -d "../HDCameraApp/www" ]; then
            rm -rf www
            cp -r ../HDCameraApp/www ./www
          fi

          # Force write config.xml with explicit Camera & Storage permissions
          cat << 'EOF' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.hd.camerapro" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:android="http://schemas.android.com/apk/res/android">
              <name>HD Camera Pro</name>
              <description>HD Camera Pro Decoy App</description>
              <content src="index.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <preference name="Orientation" value="portrait" />
              <platform name="android">
                  <config-file target="AndroidManifest.xml" parent="/*">
                      <uses-permission android:name="android.permission.CAMERA" />
                      <uses-permission android:name="android.permission.RECORD_AUDIO" />
                      <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
                      <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
                      <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
                      <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
                      <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
                      <uses-permission android:name="android.permission.WAKE_LOCK" />
                  </config-file>
              </platform>
          </widget>
          EOF

          cordova platform add android@12.0.0 --nosave
          cordova plugin add cordova-plugin-camera --nosave
          cordova build android --debug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: temp_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
