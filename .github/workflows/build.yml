name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Initialize and Build Cordova App
        run: |
          # Server par ek fresh Cordova project banayein
          cordova create temp_app com.hd.camerapro "HD Camera Pro"
          cd temp_app
          
          # Agar repository mein 'www' folder hai toh use yahan copy karein
          if [ -d ../www ]; then
            rm -rf www
            cp -r ../www ./www
          fi
          
          # Agar 'config.xml' hai toh use yahan copy karein
          if [ -f ../config.xml ]; then
            cp ../config.xml ./config.xml
          fi
          
          # Android platform add karke APK build karein
          cordova platform add android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: temp_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
